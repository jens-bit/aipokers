<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FIX-1b: maximum-scale + user-scalable stop iOS zooming the mini app when a
         field is focused. Every input is >= 16px too; the meta is the belt to that
         brace, because a zoomed webview never scrolls back and the layout stays broken. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F0E" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Railbird</title>
    <meta name="description" content="A poker player you raise. Draft him in a chat, give him a home, and watch him play. Play money only." />
    <meta property="og:title" content="Railbird — a poker player you raise" />
    <meta property="og:description" content="Draft him in a chat, give him a home, and watch him play. Play money only." />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png"/>
<meta name="application-name" content="Railbird"/>
</head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
