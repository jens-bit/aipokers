<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FIX-1b: maximum-scale + user-scalable stop iOS zooming the mini app when a
         field is focused. Every input is >= 16px too; the meta is the belt to that
         brace, because a zoomed webview never scrolls back and the layout stays broken. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F0E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Playfair+Display:wght@400;500;600;700;900&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Railbird</title>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png"/>
<meta name="application-name" content="Railbird"/>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
