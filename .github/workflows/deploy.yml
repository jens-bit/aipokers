name: Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CI-1: 22, matching the VPS (v22.22.2). Not a free choice — better-sqlite3
      # builds against NAPI_VERSION=10, which does not exist before Node 22, so
      # on 20 the prebuilt binary cannot load and every suite that imports the
      # store dies with no usable stderr (run #37).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server deps
        run: npm ci

      # Discovers every src/**/*.test.js and the fast scripts/verify-*.js.
      # No ANTHROPIC_API_KEY is set here, and the runner strips it regardless.
      - name: Server tests
        run: npm test

      # The suites that boot the stack and play hands. Slow, so they are their
      # own command locally (run before merging to main) — CI always runs them.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Client tests
        working-directory: client
        run: npm test

  # CI-2 — the gate nothing else covers: the SHIPPED bundle, in a real browser.
  # `test` proves the server and proves each component in jsdom; neither of them
  # ever loads client/dist. A screen that only throws once Vite has minified it,
  # a stylesheet that resolves for vitest but 404s from dist, a socket URL that
  # is wrong outside jsdom — all of those used to reach the VPS first.
  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server deps
        run: npm ci

      # Chromium only. The Mini App is a WebView and the desktop build is
      # Chrome; paying for firefox and webkit downloads on every run would buy
      # coverage of two engines this product never ships to.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # The real artefact under test. `npm run build:client` runs `npm install`
      # inside client/, which is also what puts the client's own deps in place.
      - name: Build the client
        run: npm run build:client

      # A scratch cwd, because src/server/store.js resolves data/app.db from
      # process.cwd() — so this is what keeps the run out of a real data/ — while
      # STATIC_DIR resolves from __dirname and still finds the client we just
      # built. NOTIFY_ENABLED is left off so nothing tries to talk to Telegram;
      # the rate limits are lifted because a browser walking four screens makes
      # far more than 60 API calls a minute from one address; and the hand pause
      # is shortened so the felt has something on it by the time the spec looks.
      #
      # No ANTHROPIC_API_KEY and no TELEGRAM_BOT_TOKEN, deliberately: decisions
      # are the check/fold fallback, and auth is open, which is what lets the
      # spec seed its two owners over plain HTTP.
      - name: Start the server
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-data"
          cd "$RUNNER_TEMP/smoke-data"
          NOTIFY_ENABLED=0 \
          RATE_LIMIT_MAX=100000 \
          RATE_LIMIT_CHAT_MAX=100000 \
          HAND_PAUSE_MS=600 \
          node "$GITHUB_WORKSPACE/src/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8765/api/stats; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "FAIL: server never answered /api/stats"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8765
          SMOKE_SHOT_DIR: smoke-shots
        run: npm run smoke:browser

      # Always: a red run is exactly when the pictures and the server log are
      # worth having.
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-shots/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy & health-check
    runs-on: ubuntu-latest
    needs: [test, smoke]
    # Pull requests get the test gate only; deploying is for pushes to main.
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: 46.62.169.246
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/aipokers

            # `npm start` runs `npm install` in client/, which rewrites both
            # lockfiles on the VPS. git pull then refuses to touch them and the
            # deploy dies before it starts (run #35). Discard the machine's
            # edits — the repo's lockfiles are the source of truth.
            echo "=== discard VPS-local lockfile churn ==="
            git checkout -- package-lock.json client/package-lock.json

            echo "=== git pull ==="
            git pull

            echo "=== pm2 restart ==="
            pm2 restart all   # NO --update-env here: non-interactive SSH lacks .bashrc env; --update-env would wipe API keys

            echo "=== wait for server (client rebuild takes ~30s) ==="
            STATUS=000
            for i in $(seq 1 45); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8765/api/stats || true)
              if [ "$STATUS" = "200" ]; then break; fi
              sleep 2
            done

            echo "=== health check: /api/stats must return 200 ==="
            if [ "$STATUS" != "200" ]; then
              echo "FAIL: /api/stats returned $STATUS (expected 200)"
              exit 1
            fi
            echo "OK: /api/stats returned 200"

            echo "=== health check: /api/agents/chat must return 401 (auth live) ==="
            AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST http://localhost:8765/api/agents/chat \
              -H "Content-Type: application/json" \
              -d '{}')
            if [ "$AUTH_STATUS" != "401" ]; then
              echo "FAIL: /api/agents/chat returned $AUTH_STATUS (expected 401 — 400 means auth regressed)"
              exit 1
            fi
            echo "OK: /api/agents/chat returned 401"

            echo "=== deploy complete ==="
