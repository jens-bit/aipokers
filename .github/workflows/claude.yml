name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Node 22 and a full install, so the tools allowed below can actually
      # build and test. Same version and cache as the Tests job in deploy.yml —
      # a PR that passes here has to mean the same thing as one that passes
      # there.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci && cd client && npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # claude_args is right for this action: v1 has no `allowed_tools`
          # input — it was replaced by `claude_args: --allowedTools` (the
          # action's docs/configuration.md says so outright). The list is
          # wrapped in inner quotes because the patterns contain spaces.
          #
          # The patterns are what were wrong. A Bash rule with NO wildcard
          # matches one exact command, so `Bash(npm ci)` allowed `npm ci` and
          # nothing else — not `npm ci --no-audit`, and not the `npm ci` in a
          # compound. Three separate ways that blocked npm:
          #
          #   1. Exact match. `Bash(npm install)`, `Bash(npm ci)`,
          #      `Bash(npm test)`, `Bash(npm run build)` each matched the bare
          #      string only. Any flag at all and the rule missed.
          #   2. `Bash(npm run test:*)` did NOT mean "the test:* scripts". A
          #      trailing `:*` is just another way of writing a trailing ` *`,
          #      so it required a SPACE after `test` — the one thing
          #      `npm run test:all` does not have.
          #   3. Compound commands are matched per subcommand: a rule must
          #      cover EACH side of an `&&`. Nothing allowed `cd`, so
          #      `npm ci && cd client && npm ci` could never be approved even
          #      with npm fully allowed.
          #
          # A trailing ` *` also matches the bare command, so `Bash(npm *)`
          # covers `npm` and every subcommand and flag. npx keeps its inner
          # command named, because npx is not a stripped wrapper — it runs
          # whatever follows it, so `Bash(npx *)` would be a rule that allows
          # anything at all.
          claude_args: '--allowedTools "Bash(npm *),Bash(npx playwright *),Bash(node *),Bash(cd *),Bash(git *)"'

